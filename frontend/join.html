<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отметиться на совещании</title>
<style>
  :root{--bg:#f2f4f7;--card:#fff;--line:#e3e8ee;--text:#11181f;--muted:#5b6875;
        --accent:#1b9aaa;--late:#c0453f;--ok:#2f8f5b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:24px;width:100%;max-width:380px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  input{font:inherit;width:100%;padding:13px;border:1px solid var(--line);
        border-radius:10px;margin-bottom:10px}
  button{font:inherit;width:100%;padding:14px;border-radius:10px;border:none;
         background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .msg{margin-top:14px;font-size:14px}
  .err{color:var(--late)} .ok{color:var(--ok)}
  .note{margin-top:18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);
        padding-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Отметиться на совещании</h1>
  <div class="sub">Совещание будет записано. Отмечаясь, вы это подтверждаете</div>
  <input id="name" placeholder="Имя и отчество" autofocus>
  <input id="pos" placeholder="Должность">
  <button onclick="join()">Я участвую</button>
  <div class="msg" id="msg"></div>
  <div id="recbox" hidden>
    <div class="note" style="border:none;padding:0;margin:18px 0 12px">
      Ваш телефон запишет только ваш голос. Так система не перепутает вас
      с другими участниками, и вас будет слышно, где бы вы ни сидели.
    </div>
    <button id="recbtn" onclick="toggleRec()">Начать запись</button>
    <div class="msg" id="recmsg"></div>
  </div>
  <div class="note">Запись остаётся на сервере компании и не передаётся
    в сторонние сервисы.</div>
</div>
<script>
const id = {{MEETING_ID}};
const code = new URLSearchParams(location.search).get('c') || '';
async function join(){
  const name = document.getElementById('name').value.trim();
  const msg = document.getElementById('msg');
  if(!name){ msg.className='msg err'; msg.textContent='Укажите имя'; return; }
  const r = await fetch(`/api/meetings/${id}/participants`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, position: document.getElementById('pos').value.trim(), code})});
  if(r.ok){
    msg.className='msg ok';
    msg.textContent='Готово. Вы в списке участников';
    document.querySelector('button').disabled = true;
    window.myName = name;
    document.getElementById('recbox').hidden = false;
  } else {
    const d = await r.json().catch(()=>({detail:'не получилось'}));
    msg.className='msg err';
    msg.textContent = d.detail || 'не получилось отметиться';
  }
}

let rec = null, chunks = [], startedAt = 0;

async function toggleRec(){
  const btn = document.getElementById('recbtn');
  const msg = document.getElementById('recmsg');
  if (rec && rec.state === 'recording'){
    rec.stop();
    btn.textContent = 'Отправляю…';
    btn.disabled = true;
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  rec = new MediaRecorder(stream);
  chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const fd = new FormData();
    fd.append('file', new Blob(chunks, {type:'audio/webm'}), 'track.webm');
    fd.append('speaker', window.myName || 'Участник');
    fd.append('offset', '0');
    const r = await fetch(`/api/meetings/${id}/tracks`, {method:'POST', body: fd});
    const d = await r.json();
    msg.className = 'msg ok';
    msg.textContent = `Дорожка отправлена. Всего дорожек: ${d.tracks}`;
    document.getElementById('recbtn').textContent = 'Записать ещё раз';
    document.getElementById('recbtn').disabled = false;
  };
  rec.start();
  startedAt = Date.now();
  btn.textContent = 'Остановить и отправить';
  msg.className = 'msg';
  msg.innerHTML = '<span style="color:#c0453f">● идёт запись вашего голоса</span>';
}
</script>
</body>
</html>
