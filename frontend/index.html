<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hattama</title>
<style>
  :root{
    --bg:#f2f4f7; --card:#fff; --soft:#f6f8fa; --line:#e3e8ee;
    --text:#11181f; --muted:#5b6875; --accent:#1b9aaa;
    --ok:#2f8f5b; --late:#c0453f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:24px 16px}
  .frame{width:390px;max-width:100%;height:780px;max-height:92vh;background:var(--card);
         border:1px solid #cfd6de;border-radius:28px;overflow:hidden;
         display:flex;flex-direction:column}
  .bar .mark{color:var(--accent)}
  .bar{height:34px;display:flex;align-items:center;justify-content:center;
       border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .screen{flex:1;overflow-y:auto;padding:20px}
  .caption{margin-top:12px;font-size:12px;color:var(--muted)}
  h2{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  button{font:inherit;width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);
         background:var(--card);color:var(--text);cursor:pointer;margin-top:8px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.ghost{background:var(--soft)}
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--card)}
  .tabbar div{flex:1;text-align:center;padding:9px 0;font-size:10px;color:var(--muted);cursor:pointer}
  .tabbar div.on{color:var(--accent);font-weight:600}
  .tabbar span{display:block;font-size:17px;line-height:1.1}
  .mic{width:112px;height:112px;border-radius:50%;background:var(--accent);color:#fff;
       display:flex;align-items:center;justify-content:center;font-size:40px;
       margin:22px auto 12px;cursor:pointer}
  .mic.stop{background:var(--late);font-size:30px}
  .center{text-align:center;font-weight:600;margin-bottom:18px}
  .sect{font-weight:600;font-size:15px;margin:18px 0 10px;display:flex;
        justify-content:space-between;align-items:baseline}
  .sect a{color:var(--accent);font-size:13px;cursor:pointer}
  .rec-btn{width:120px;height:120px;border-radius:50%;margin:24px auto;display:flex;
           align-items:center;justify-content:center;background:var(--accent);color:#fff;
           font-weight:600;cursor:pointer;border:none}
  .rec-btn.stop{background:var(--late)}
  .item{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
  .item h3{margin:0 0 6px;font-size:15px;font-weight:600}
  .meta{font-size:13px;color:var(--muted)}
  .quote{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px;
         border-left:2px solid var(--line);padding-left:10px}
  .chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;
        border:1px solid var(--line)}
  .chip.work{color:var(--accent)} .chip.late{color:var(--late);border-color:var(--late)}
  .chip.done{color:var(--ok);border-color:var(--ok)}
  .rec-line{display:flex;align-items:center;gap:8px;justify-content:center;
            color:var(--late);font-size:13px;margin-top:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--late);animation:p 1.1s infinite}
  @keyframes p{50%{opacity:.2}}
  .timer{text-align:center;font-size:34px;font-variant-numeric:tabular-nums;margin-top:16px}
  .level{height:4px;background:var(--soft);border-radius:2px;margin:16px 0;overflow:hidden}
  .level i{display:block;height:100%;background:var(--accent);width:20%;transition:width .1s}
  .step{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--muted)}
  .step.active{color:var(--text);font-weight:600}
  .step.done{color:var(--text)}
  .mark{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
        display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .step.done .mark{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.active .mark{border-color:var(--accent);border-right-color:transparent;
                     animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{width:auto;flex:1;margin:0;padding:8px;font-size:14px}
  .tabs button.on{background:var(--soft);border-color:#cfd6de;font-weight:600}
  .seg{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .time{color:var(--muted);font-size:12px;margin-right:8px}
  .who{font-weight:600}
  input{font:inherit;width:100%;padding:11px;border:1px solid var(--line);
        border-radius:10px;margin-bottom:8px;background:var(--card);color:var(--text)}
  .qr{display:flex;justify-content:center;padding:12px;background:var(--soft);
      border-radius:10px;margin-bottom:14px}
  .qr svg{width:150px;height:150px}
  .empty{color:var(--muted);font-size:14px;padding:12px 0}
  .foot{border-top:1px solid var(--line);padding:12px 20px}
  .back{font-size:13px;color:var(--accent);cursor:pointer;margin-bottom:12px;display:inline-block}
</style>
</head>
<body>
<div class="frame">
  <div class="bar"><svg class="mark" viewBox="0 0 34 30" width="15" height="13" fill="currentColor" aria-hidden="true"><rect x="0" y="6" width="8" height="18" rx="4"/><rect x="12" y="0" width="8" height="30" rx="4"/><rect x="24" y="4" width="8" height="19" rx="4"/></svg><span style="margin-left:7px">Hattama · работает офлайн</span></div>
  <div class="screen" id="screen"></div>
  <div class="foot" id="foot" hidden></div>
</div>
<div class="caption">демо мобильного приложения</div>

<script>
const S = {meetingId:null, qrTimer:null, tab:'tasks', data:null, recorder:null, chunks:[], t0:0, timer:null};
const el = document.getElementById('screen');
const foot = document.getElementById('foot');
const api = (p,o) => fetch(p,o).then(r=>r.json());

function showFoot(html){ foot.hidden = !html; foot.innerHTML = html || ''; }

async function home(){
  showFoot('');
  const list = await api('/api/meetings');
  el.innerHTML = `
    <div class="mic" onclick="newMeeting()">◉</div>
    <div class="center">Новое совещание</div>
    <button class="ghost" onclick="document.getElementById('f0').click()">Загрузить файл</button>
    <input type="file" id="f0" accept="audio/*,video/*" style="display:none"
           onchange="upload(this.files[0])">
    <div class="sect">Последние совещания <a onclick="home()">Все</a></div>
    ${list.length ? list.map(m=>`
      <div class="item" onclick="open_(${m.id})" style="cursor:pointer">
        <h3>${m.title}</h3>
        <div class="meta">${new Date(m.meeting_date).toLocaleDateString('ru-RU')} · ${m.status}</div>
      </div>`).join('') : '<div class="empty">Совещаний пока нет</div>'}`;
  tabbar('meetings');
}

function tabbar(active){
  foot.hidden = false;
  foot.style.padding = '0';
  foot.innerHTML = `<div class="tabbar">
    <div class="${active==='meetings'?'on':''}" onclick="home()"><span>▤</span>Совещания</div>
    <div class="${active==='tasks'?'on':''}" onclick="allTasks()"><span>✓</span>Поручения</div>
    <div class="${active==='me'?'on':''}" onclick="profile()"><span>◍</span>Профиль</div>
  </div>`;
}

async function allTasks(){
  const list = await api('/api/meetings');
  const done = list.filter(m=>m.status==='готово');
  if(!done.length){ el.innerHTML = '<h2>Поручения</h2><div class="empty">Пока нет разобранных совещаний</div>'; tabbar('tasks'); return; }
  const d = await api('/api/meetings/'+done[0].id);
  S.meetingId = d.id; S.data = d; S.tab='tasks'; result();
}

function profile(){
  el.innerHTML = `<h2>Профиль</h2>
    <div class="sub">Демонстрационный режим</div>
    <div class="item"><h3>Данные не покидают компьютер</h3>
      <div class="meta">Распознавание речи и разбор поручений работают локально.
      Интернет нужен только для первой установки моделей.</div></div>`;
  tabbar('me');
}

async function newMeeting(){
  const d = await api('/api/meetings/draft', {method:'POST'});
  S.meetingId = d.id;
  participants();
}

async function participants(){
  foot.style.padding = '12px 20px';
  const people = await api(`/api/meetings/${S.meetingId}/participants`);
  const qr = await fetch(`/api/meetings/${S.meetingId}/qr.svg?_=`+Date.now()).then(r=>r.text());
  el.innerHTML = `
    <span class="back" onclick="home()">← Совещания</span>
    <h2>Кто в комнате</h2>
    <div class="sub">Отметился значит уведомлён о записи</div>
    <div class="qr" id="qrbox">${qr}</div>
    <div class="meta" style="text-align:center;margin:-6px 0 14px;font-size:12px">
      код действует 4 минуты · отметиться можно только из сети переговорной</div>
    <input id="pname" placeholder="Имя и отчество">
    <input id="ppos" placeholder="Должность">
    <button onclick="addPerson()">Добавить участника</button>
    <div style="margin-top:16px">
      ${people.map(p=>`<div class="item">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
          <div><h3>${p.name}</h3><div class="meta">${p.position||''}</div></div>
          <span style="color:var(--muted);cursor:pointer;font-size:13px"
                onclick="removePerson(${p.id})">убрать</span>
        </div></div>`).join('')
        || '<div class="empty">Пока никто не отметился</div>'}
    </div>`;
  showFoot(`<button class="primary" onclick="recordScreen()">Записывать на этом устройстве</button>
            <button onclick="finishTracks()">Собрать совещание из дорожек участников</button>`);
  clearInterval(S.qrTimer);
  S.qrTimer = setInterval(async ()=>{
    const box = document.getElementById('qrbox');
    if(!box){ clearInterval(S.qrTimer); return; }
    box.innerHTML = await fetch(`/api/meetings/${S.meetingId}/qr.svg?_=`+Date.now()).then(r=>r.text());
  }, 100000);
}

async function finishTracks(){
  processing('Готовлю звук');
  const r = await fetch(`/api/meetings/${S.meetingId}/process`, {method:'POST'});
  if(!r.ok){
    const d = await r.json().catch(()=>({detail:'нет дорожек'}));
    el.innerHTML = `<h2>Пока нечего собирать</h2><div class="sub">${d.detail}</div>
      <button onclick="participants()">Назад к участникам</button>`;
    return;
  }
  poll();
}

async function removePerson(id){
  await fetch('/api/participants/'+id, {method:'DELETE'});
  participants();
}

async function addPerson(){
  const name = document.getElementById('pname').value.trim();
  if(!name) return;
  await fetch(`/api/meetings/${S.meetingId}/participants`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, position: document.getElementById('ppos').value.trim()})});
  participants();
}

function recordScreen(){
  foot.style.padding = '12px 20px';
  el.innerHTML = `
    <h2>Запись совещания</h2>
    <div class="sub">Звук не покидает сервер компании</div>
    <div class="rec-btn" id="recbtn" onclick="toggleRec()">Начать</div>
    <div class="timer" id="timer">00:00</div>
    <div class="level"><i id="lvl"></i></div>
    <div id="recline"></div>
    <button class="ghost" onclick="document.getElementById('f').click()">Загрузить файл записи</button>
    <input type="file" id="f" accept="audio/*,video/*" style="display:none" onchange="upload(this.files[0])">`;
  showFoot('');
}

async function toggleRec(){
  const btn = document.getElementById('recbtn');
  if(S.recorder && S.recorder.state === 'recording'){ S.recorder.stop(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  S.recorder = new MediaRecorder(stream); S.chunks = [];
  S.recorder.ondataavailable = e => S.chunks.push(e.data);
  S.recorder.onstop = () => {
    stream.getTracks().forEach(t=>t.stop());
    clearInterval(S.timer);
    upload(new Blob(S.chunks, {type:'audio/webm'}), 'recording.webm');
  };
  S.recorder.start();
  btn.textContent = 'Стоп'; btn.classList.add('stop');
  document.getElementById('recline').innerHTML =
    '<div class="rec-line"><span class="dot"></span>идёт запись, участники уведомлены</div>';
  S.t0 = Date.now();
  S.timer = setInterval(()=>{
    const s = Math.floor((Date.now()-S.t0)/1000);
    document.getElementById('timer').textContent =
      String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    document.getElementById('lvl').style.width = (20+Math.random()*60)+'%';
  }, 200);
}

async function upload(blob, name){
  if(!blob) return;
  processing('Готовлю звук');
  const fd = new FormData();
  fd.append('file', blob, name || blob.name || 'audio.wav');
  if(S.meetingId) fd.append('meeting_id', S.meetingId);
  const d = await api('/api/meetings', {method:'POST', body:fd});
  S.meetingId = d.id;
  poll();
}

const STEPS = ['Готовлю звук','Распознаю речь','Разделяю говорящих','Ищу поручения'];
function processing(current){
  const idx = STEPS.indexOf(current);
  el.innerHTML = `<h2>Обрабатываю запись</h2>
    <div class="sub">Всё считается на этом компьютере</div>
    ${STEPS.map((s,i)=>`
      <div class="step ${i<idx?'done':i===idx?'active':''}">
        <span class="mark">${i<idx?'✓':''}</span>${s}
      </div>`).join('')}`;
  showFoot('');
}

function statusToStep(st){
  if(st.startsWith('распозна')) return 'Распознаю речь';
  if(st.startsWith('разбираю')) return 'Ищу поручения';
  return 'Готовлю звук';
}

async function poll(){
  const d = await api('/api/meetings/'+S.meetingId);
  if(d.status === 'готово'){ S.data = d; result(); return; }
  if(d.status.startsWith('ошибка')){
    el.innerHTML = `<h2>Не получилось</h2><div class="sub">${d.status}</div>
      <button onclick="home()">К совещаниям</button>`; return;
  }
  processing(statusToStep(d.status));
  setTimeout(poll, 1500);
}

async function open_(id){ S.meetingId = id; S.data = await api('/api/meetings/'+id); result(); }

function chip(st){
  const c = st==='просрочено'?'late':st==='выполнено'?'done':'work';
  return `<span class="chip ${c}">${st}</span>`;
}

function result(){
  foot.style.padding = '12px 20px';
  const d = S.data;
  const tasks = d.tasks.map(t=>`
    <div class="item">
      <h3>${t.text}</h3>
      <div class="meta">${t.assignee||'не указан'} · ${
        t.deadline ? new Date(t.deadline).toLocaleDateString('ru-RU') : 'срок не назван'} · ${chip(t.status)}</div>
      ${t.deadline_raw ? `<div class="meta" style="font-size:12px">сказано: ${t.deadline_raw}${
        t.deadline_rule? ' · '+t.deadline_rule : ''}</div>`:''}
      ${t.quote ? `<div class="quote">${t.quote}</div>`:''}
    </div>`).join('') || '<div class="empty">Поручений не найдено</div>';

  const tr = d.transcript.map(s=>`
    <div class="seg"><span class="time">${new Date(s.start*1000).toISOString().substr(14,5)}</span>
    <span class="who">${s.speaker}:</span> ${s.text}</div>`).join('');

  el.innerHTML = `
    <span class="back" onclick="home()">← Совещания</span>
    <h2>${d.title}</h2>
    <div class="sub">${d.tasks.length} поручений · ${d.transcript.length} реплик</div>
    <div class="tabs">
      <button class="${S.tab==='tasks'?'on':''}" onclick="S.tab='tasks';result()">Поручения</button>
      <button class="${S.tab==='tr'?'on':''}" onclick="S.tab='tr';result()">Стенограмма</button>
    </div>
    ${S.tab==='tasks'?tasks:tr}`;
  showFoot(`<button class="primary" onclick="location.href='/api/meetings/${d.id}/export'">Скачать протокол</button>`);
}

home();
</script>
</body>
</html>
